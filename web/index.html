<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#a6298e" />
    <title>My Scene</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="data:," />
  </head>
  <body>
    <main id="shell">
      <button id="browser-options" aria-label="Game options" title="Game options">⋯</button>
      <header>
        <a id="brand" href="./" aria-label="My Scene home"
          >my<span>scene</span><i>✳</i></a
        >
        <div id="week-label">Fashion, friends & the big city</div>
        <button id="sound" aria-label="Mute sound">♫ Sound on</button
        ><button id="fullscreen" aria-label="Toggle fullscreen">⛶</button>
      </header>
      <div id="layout">
        <section id="stage-wrap" aria-label="Game">
          <canvas
            id="stage"
            width="800"
            height="600"
            aria-label="My Scene game world"
          ></canvas>
          <div id="hotspots"></div>
          <input
            id="signin-name"
            aria-label="Your name on the phone"
            maxlength="30"
            autocomplete="off"
            placeholder="Enter your name"
            hidden
          />
          <div id="overlay" hidden></div>
          <div id="loading">Opening your world…<progress></progress></div>
        </section>
        <aside id="panel" aria-label="Activity controls">
          <h1>Welcome back to My Scene</h1>
          <p>A whole city of friends, fashion and weekend plans.</p>
        </aside>
      </div>
      <nav id="quick" aria-label="Game shortcuts"></nav>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <dialog id="dialog">
      <div id="dialog-body"></div>
      <button id="dialog-close" class="close" aria-label="Close dialog">
        ×
      </button>
    </dialog>
    <input
      id="save-import"
      type="file"
      accept=".json,application/json"
      hidden
    />
    <script type="module" src="app.mjs"></script>
  </body>
</html>
